name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: 3.11

permissions:
  id-token: write
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        run: pip install poetry

      - name: Determine dependencies
        run: poetry lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install Dependencies using Poetry
        run: poetry install

      - name: Check formatting
        run: poetry run black --check .

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        run: pip install poetry

      - name: Determine dependencies
        run: poetry lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install Dependencies using Poetry
        run: poetry install

      - name: Check code
        run: poetry run flake8

  testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both supported snakemake majors. The two legs resolve to the
        # newest 8.x and 9.x, which pull different snakemake-interface-storage-
        # plugins majors (3.x vs 4.x, via snakemake-storage-plugin-s3), so passing
        # on one does not imply the other. The 8.x leg keeps the >=8.30 floor.
        snakemake: [">=8.30,<9", ">=9,<10"]
    name: testing (snakemake ${{ matrix.snakemake }})
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        run: pip install poetry

      - name: Constrain snakemake for this matrix leg
        # A full re-resolve (not an overlay install) is required: the resolved
        # snakemake release drives the snakemake-interface-storage-plugins major,
        # which in turn pins a compatible snakemake-storage-plugin-s3 version.
        run: poetry add --group dev --lock "snakemake@${{ matrix.snakemake }}"

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Verify snakemake major matches the matrix leg
        # Guard against a silent mis-resolution: fail loudly if the resolver ever
        # selects the wrong major for a leg instead of passing green while testing
        # the same major on both legs.
        run: |
          installed=$(poetry run python -c "import importlib.metadata as m; print(m.version('snakemake'))")
          echo "resolved snakemake: $installed"
          case "${{ matrix.snakemake }}" in
            ">=8.30,<9") expected=8 ;;
            ">=9,<10") expected=9 ;;
            *) echo "::error::unhandled matrix leg '${{ matrix.snakemake }}'"; exit 1 ;;
          esac
          if [ "${installed%%.*}" != "$expected" ]; then
            echo "::error::expected snakemake ${expected}.x for leg '${{ matrix.snakemake }}', got ${installed}"
            exit 1
          fi

      - name: Setup minio
        run: |
          # Upstream MinIO images are no longer anonymously pullable (Docker Hub
          # minio/minio was removed and quay.io/minio/minio requires auth), so use
          # pgsty/silo, a community-maintained MinIO build that is a drop-in
          # replacement (same server command, env vars, and health endpoints).
          docker run -d -p 9000:9000 --name minio \
            -e "MINIO_ROOT_USER=minio" \
            -e "MINIO_ROOT_PASSWORD=minio123" \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          # Wait for MinIO's object layer to come up before running the tests.
          # /minio/health/live and /minio/health/ready can return 200 before the
          # object layer is initialized; /minio/health/cluster returns 503 until
          # the object layer, bucket metadata, and IAM are ready.
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/cluster; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready" >&2
          docker logs minio
          exit 1

      - name: Run pytest
        env:
          SNAKEMAKE_AWS_BATCH_JOB_QUEUE: "${{ secrets.SNAKEMAKE_AWS_BATCH_JOB_QUEUE }}"
          SNAKEMAKE_AWS_BATCH_JOB_ROLE: "${{ secrets.SNAKEMAKE_AWS_BATCH_JOB_ROLE }}"
        run: poetry run coverage run -m pytest tests/ --ignore=tests/tests_true_api.py -v

      - name: Run Coverage
        run: poetry run coverage report -m
